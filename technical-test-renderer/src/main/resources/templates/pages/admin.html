<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Créer un vol</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        form { max-width: 600px; margin: 0 auto; }
        label { display:block; margin-top: 10px; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        button { margin-top: 12px; padding: 10px 16px; }
        .message { margin-top: 12px; padding: 10px; background: #f0f8ff; border: 1px solid #cce; }
    </style>
</head>
<body>
<h1>Page d'administration - Créer un vol</h1>
<div th:if="${message}" class="message" th:text="${message}"></div>
<form th:action="@{/admin}" th:object="${flight}" method="post">
    <label for="origin">IATA origine</label>
    <input type="text" id="origin" th:field="*{origin.iata}" placeholder="Ex: LAX" required />

    <label for="destination">IATA destination</label>
    <input type="text" id="destination" th:field="*{destination.iata}" placeholder="Ex: JFK" required />

    <label for="departure">Départ (ISO LocalDateTime ex: 2023-12-01T10:30)</label>
    <input type="text" id="departure" th:field="*{departure}" placeholder="YYYY-MM-DDTHH:MM" required />

    <label for="arrival">Arrivée (ISO LocalDateTime)</label>
    <input type="text" id="arrival" th:field="*{arrival}" placeholder="YYYY-MM-DDTHH:MM" required />

    <label for="price">Prix</label>
    <input type="number" step="0.01" id="price" th:field="*{price}" required />

    <label for="image">URL image</label>
    <input type="url" id="image" th:field="*{image}" />

    <button type="submit">Créer le vol</button>
</form>
</body>
</html>
