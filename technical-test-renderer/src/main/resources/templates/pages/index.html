<!DOCTYPE html>
<html lang="fr" layout:decorate="~{decorators/master}"
      xmlns:layout="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recherche de Vols</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background-color: #f0f7fc;
            color: #333;
        }

        header {
            background-color: #3498db;
            padding: 20px;
            text-align: center;
            color: #fff;
        }

        section {
            padding: 40px;
        }

        footer {
            background-color: #3498db;
            padding: 10px 0;
            bottom: 0;
            width: 100%;
            text-align: center;
            color: #fff;
        }

        td,
        th {
            border: 1px solid rgb(190, 190, 190);
            padding: 10px;
        }

        td {
            text-align: center;
        }

        tr:nth-child(even) {
            background-color: #eee;
        }

        th[scope='col'] {
            background-color: #696969;
            color: #fff;
        }

        caption {
            padding: 10px;
            caption-side: bottom;
        }

        table {
            border-collapse: collapse;
            border: 2px solid rgb(200, 200, 200);
            letter-spacing: 1px;
            font-family: sans-serif;
            font-size: 0.8rem;
            width: 100%;
        }

        .filters {
            text-align:center; margin-bottom:16px;
        }

        .filters label { margin-right:6px; }
    </style>
</head>
<body>
<header>
    <h1>Recherche de Vols</h1>
    <p style="text-align:center; margin-top:8px;"><a href="/admin">Accéder à la page d'administration</a></p>
</header>

<section>
    <!-- Contenu de la recherche de vols -->
    <h2>Bienvenue sur notre site de recherche de vols</h2>
    <p>Commencez votre aventure en trouvant les meilleurs vols disponibles.</p>

    <!-- Formulaire de filtres : uniquement tri sur price/origin/destination et ordre -->
    <form method="get" th:action="@{/}" class="filters">


        <label for="sort">Trier</label>
        <select id="sort" name="sort">
            <option th:value="'price'" th:selected="${sort == 'price'}">Trier par prix</option>
            <option th:value="'origin'" th:selected="${sort == 'origin'}">Trier par origine</option>
            <option th:value="'destination'" th:selected="${sort == 'destination'}">Trier par destination</option>
        </select>

        <label for="order">Ordre</label>
        <select id="order" name="order">
            <option th:value="'asc'" th:selected="${order == 'asc'}">Ascendant</option>
            <option th:value="'desc'" th:selected="${order == 'desc'}">Descendant</option>
        </select>

        <button type="submit">Appliquer</button>
    </form>

        <table>
            <tr>
                <th scope="col">Départ de</th>
                <th scope="col">Arrivée à</th>
                <th scope="col">Prix</th>
                <th scope="col">Photo</th>
            </tr>
            <tr th:each="flight : ${flights}">

                <td th:text="${flight.origin.name}"></td>
                <td th:text="${flight.destination.name}"></td>
                <td th:text="${#numbers.formatDecimal(flight.price, 1, 'COMMA', 2, 'POINT')} + ' €'"></td>
                <td>
                    <img th:src="${flight.image}"
                         alt="Photo destination"
                         style="max-width:100px; max-height:60px; object-fit:cover;"
                         loading="lazy" />
                </td>

            </tr>
        </table>
</section>

<footer>
    <p>&copy; 2023 Recherche de Vols. Tous droits réservés.</p>
</footer>
</body>
</html>
